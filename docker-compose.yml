# Local development dependencies only. Application containers land in T12.
services:
  postgres:
    image: postgres:17-alpine
    container_name: yopay-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yopay}
      POSTGRES_USER: ${POSTGRES_USER:-yopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yopay}
    ports:
      # 5433 on the host so it never collides with a local Postgres or YoMail's.
      - "5433:5432"
    volumes:
      - yopay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yopay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yopay-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yopay-pgdata:

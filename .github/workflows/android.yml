# Builds the device app and leaves the APK attached to the run.
#
# It exists because an Android SDK is a large thing to keep on a laptop for an app that
# changes a few times a month, and because a build that happens on a runner is the same
# build every time - no "works on my machine" between the phone trial and whatever ships.
#
# Run it from the Actions tab (Run workflow), or by pushing a change under yopay-android.
# The APK lands under Artifacts on the run's page.
name: android

on:
  workflow_dispatch:
  push:
    paths:
      - 'yopay-android/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 and Kotlin 2.0 both want 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Command line tools and the licence acceptance. The Android plugin fetches the
      # platform and build tools it needs on its own once these are in place.
      - uses: android-actions/setup-android@v3

      # The repository has no Gradle wrapper, so the action supplies Gradle itself.
      # Pinned rather than "latest": a build that silently changes toolchain between two
      # runs is a build whose output nobody can compare.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        working-directory: yopay-android
        run: gradle assembleDebug --no-daemon --stacktrace

      # Debug signing, which is what a sideloaded trial build needs. A release build has
      # to be signed with a key that is not in this repository, and that is a separate
      # job for the day there is something to publish.
      - uses: actions/upload-artifact@v4
        with:
          name: yopay-device-debug-apk
          path: yopay-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
